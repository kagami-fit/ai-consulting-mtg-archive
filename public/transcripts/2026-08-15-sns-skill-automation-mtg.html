<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>第11回 SNS投稿自動化MTG Plaud要約メモ | AI Consulting</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="report-page">
    <main class="report-shell">
      <nav class="report-topbar" aria-label="戻る">
        <a href="../index.html">← MTGアーカイブへ戻る</a>
        <span>Plaud Memo / 2026.08.15</span>
      </nav>

      <header class="report-hero transcript-hero">
        <p class="eyebrow">Plaud Memo</p>
        <h1>第11回 SNS投稿自動化MTG</h1>
        <p>08/15の接続確認と本編を統合して整理したPlaud要約メモ。</p>
        <div class="report-meta">
          <span>クライアント：内田豊様 / 株式会社 籠や</span>
          <span>担当：加賀美</span>
          <span>会議時間：1:19:31（2本）</span>
        </div>
      </header>

      <section class="report-section">
        <div class="section-heading">
          <h2>要約メモ</h2>
          <p>Plaudの要約とアウトラインから、共有用に要点と流れを整理しています</p>
        </div>
        <pre id="transcriptText" class="transcript-full-text">読み込み中...</pre>
      </section>
    </main>

    <script>
      fetch("./2026-08-15-sns-skill-automation-mtg.txt")
        .then((response) => {
          if (!response.ok) throw new Error("要約メモを読み込めませんでした");
          return response.text();
        })
        .then((text) => {
          document.querySelector("#transcriptText").textContent = text;
        })
        .catch((error) => {
          document.querySelector("#transcriptText").textContent = error.message;
        });
    </script>
  </body>
</html>
